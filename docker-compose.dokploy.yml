services:
  local-embedding-init:
    image: alpine:3.20
    command:
      - sh
      - -lc
      - |
        set -e

        apk add --no-cache curl ca-certificates

        mkdir -p /models

        cat > /models/granite-embedding-384.yaml <<'EOF'
        name: granite-embedding-384
        backend: llama-cpp
        type: embeddings
        embeddings: true
        parameters:
          model: granite-embedding-107m-multilingual-f16.gguf
        EOF

        if [ ! -s /models/granite-embedding-107m-multilingual-f16.gguf ]; then
          echo "Downloading granite embedding model..."
          curl -L \
            -o /models/granite-embedding-107m-multilingual-f16.gguf \
            https://huggingface.co/bartowski/granite-embedding-107m-multilingual-GGUF/resolve/main/granite-embedding-107m-multilingual-f16.gguf
        else
          echo "Embedding model already exists, skip download."
        fi

        echo "=== /models content ==="
        ls -lah /models

        echo "=== granite-embedding-384.yaml ==="
        cat /models/granite-embedding-384.yaml
    volumes:
      - local_embedding_models:/models
    restart: "no"
    networks:
      - dokploy-network

  local-embedding:
    image: localai/localai:latest-cpu
    environment:
      MODELS_PATH: /models
      THREADS: 2
      CONTEXT_SIZE: 512
    volumes:
      - local_embedding_models:/models
    depends_on:
      local-embedding-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - dokploy-network

  configure-embeddings:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint:
      - sh
      - -lc
      - |
        set -e

        echo "Running migrations before configuring embeddings..."
        /app/.venv/bin/alembic upgrade head

        echo "Embedding schema preflight..."
        /app/.venv/bin/python - <<'PY'
        import asyncio
        from sqlalchemy import text
        from src.db import engine

        async def main():
            async with engine.connect() as conn:
                dims = await conn.execute(text("""
                    SELECT c.relname AS table_name, a.atttypmod AS dim
                    FROM pg_attribute a
                    JOIN pg_class c ON a.attrelid = c.oid
                    JOIN pg_namespace n ON c.relnamespace = n.oid
                    WHERE n.nspname = 'public'
                      AND c.relname IN ('documents', 'message_embeddings')
                      AND a.attname = 'embedding'
                    ORDER BY c.relname
                """))
                print("vector dims:", [(row.table_name, row.dim) for row in dims])

                for table in ("documents", "message_embeddings"):
                    count = await conn.scalar(text(
                        f'SELECT COUNT(*) FROM public."{table}" WHERE embedding IS NOT NULL'
                    ))
                    print(f"{table} non-null embeddings:", count)

                indexes = await conn.execute(text("""
                    SELECT tablename, indexname, indexdef
                    FROM pg_indexes
                    WHERE schemaname = 'public'
                      AND tablename IN ('documents', 'message_embeddings')
                      AND indexdef ILIKE '%USING hnsw%'
                    ORDER BY tablename, indexname
                """))
                for row in indexes:
                    print("hnsw index:", row.tablename, row.indexname, row.indexdef)

            await engine.dispose()

        asyncio.run(main())
        PY

        echo "Configuring embedding schema..."
        /app/.venv/bin/python scripts/configure_embeddings.py --yes
    depends_on:
      database:
        condition: service_healthy
      local-embedding:
        condition: service_started
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@database:5432/postgres
      VECTOR_STORE_TYPE: pgvector

      LOCAL_EMBEDDING_API_KEY: dummy
      EMBEDDING_MODEL_CONFIG__MODEL: granite-embedding-384
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: http://local-embedding:8080/v1
      EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY_ENV: LOCAL_EMBEDDING_API_KEY
      EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE: never
      EMBEDDING_VECTOR_DIMENSIONS: "384"
    restart: "no"
    networks:
      - dokploy-network
  api:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      local-embedding:
        condition: service_started
      configure-embeddings:
        condition: service_completed_successfully
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@database:5432/postgres
      CACHE_URL: redis://redis:6379/0?suppress=true
      CACHE_ENABLED: "true"

      AUTH_USE_AUTH: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}

      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY}

      DERIVER_MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      SUMMARY_MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DREAM_DEDUCTION_MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DREAM_INDUCTION_MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      LOCAL_EMBEDDING_API_KEY: dummy
      EMBEDDING_MODEL_CONFIG__MODEL: granite-embedding-384
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: http://local-embedding:8080/v1
      EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY_ENV: LOCAL_EMBEDDING_API_KEY
      EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE: never
      EMBEDDING_VECTOR_DIMENSIONS: "384"

      VECTOR_STORE_TYPE: pgvector

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read()\""
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

    networks:
      - dokploy-network

  deriver:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      local-embedding:
        condition: service_started
      configure-embeddings:
        condition: service_completed_successfully
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@database:5432/postgres
      CACHE_URL: redis://redis:6379/0?suppress=true
      CACHE_ENABLED: "true"

      AUTH_USE_AUTH: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}

      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY}

      DERIVER_MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      SUMMARY_MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DREAM_DEDUCTION_MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DREAM_INDUCTION_MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: ${HONCHO_MODEL}
      DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LLM_OPENAI_BASE_URL}

      LOCAL_EMBEDDING_API_KEY: dummy
      EMBEDDING_MODEL_CONFIG__MODEL: granite-embedding-384
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: http://local-embedding:8080/v1
      EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY_ENV: LOCAL_EMBEDDING_API_KEY
      EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE: never
      EMBEDDING_VECTOR_DIMENSIONS: "384"

      VECTOR_STORE_TYPE: pgvector

    restart: unless-stopped
    networks:
      - dokploy-network

  database:
    image: pgvector/pgvector:pg15
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - honcho_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dokploy-network

  redis:
    image: redis:8.2
    volumes:
      - honcho_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  honcho_pgdata:
  honcho_redis_data:
  local_embedding_models:

networks:
  dokploy-network:
    external: true
